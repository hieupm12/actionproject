name: WorkFlow Midnight
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  ECR_REPOSITORY: "webtest-images"

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Maven Build
        run: mvn install

      - name: Upload Build Artifact (WAR)
        uses: actions/upload-artifact@v7
        with:
          name: vprofile-app
          path: target/*.war

      - name: Notify if Build Fails
        if: failure()
        run: echo "Build job failed! Please check logs."

  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run tests on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Checkstyle
        if: github.ref == 'refs/head/main'
        run: mvn checkstyle:checkstyle

      - name: Run tests on other branches
        if: github.ref != 'refs/heads/main'
        run: echo "Skipping unit tests and code analysis"

  Security_Scan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Download Artifact (.war)
        uses: actions/download-artifact@v4
        with:
          name: vprofile-app
          path: .                      

      - name: Scan Artifact and Export HTML
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: 'fs'                
          scan-ref: 'vprofile-v2.war'    
          format: 'template'             
          template: '@contrib/html.tpl'  
          output: 'trivy-security-report.html'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Security Report
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-report          
          path: trivy-security-report.html    
          retention-days: 5
