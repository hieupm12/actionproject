name: WorkFlow Midnight
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  ECR_REPOSITORY: "webtest-images"

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Maven Build
        run: mvn install

      - name: Upload Build Artifact (WAR)
        uses: actions/upload-artifact@v7
        with:
          name: vprofile-app
          path: target/*.war

      - name: Notify if Build Fails
        if: failure()
        run: echo "Build job failed! Please check logs."

  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run tests on main branch
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Checkstyle
        if: github.ref == 'refs/head/main'
        run: mvn checkstyle:checkstyle

      - name: Run tests on other branches
        if: github.ref != 'refs/heads/main'
        run: echo "Skipping unit tests and code analysis"

  Security_Scan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: vprofile-war-artifact
          path: .

      - name: Install Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          cache: false

      # THAY ĐỔI 1: Yêu cầu Trivy xuất ra file HTML tên là trivy-report.html
      - name: Scan .war File and Export HTML
        run: |
          trivy fs vprofile-v2.war \
            --format template \
            --template "@contrib/html.tpl" \
            --output trivy-report.html \
            --severity CRITICAL,HIGH \
            --exit-code 0 

      # THAY ĐỔI 2: Upload file HTML đó lên kho Artifact của GitHub
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report # Tên gói hàng chứa báo cáo
          path: trivy-report.html    # Lấy đúng file vừa tạo
          retention-days: 5  

